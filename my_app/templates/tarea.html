{% extends 'base.html' %}

{% block content %}
    <!DOCTYPE html>
    <html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Crear Tarea</title>
        <!-- Enlace a Bootstrap desde el CDN -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <div class="container mt-5">
            <div class="text-center mb-4">
                <h1 class="display-4">Crear Tarea</h1>
                <p class="lead">Complete el formulario para agregar una nueva tarea.</p>
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_title" class="form-label">Título:</label>
                    {{ form.title }}
                </div>

                <div class="mb-3">
                    <label for="id_description" class="form-label">Descripción:</label>
                    {{ form.description }}
                </div>

                <div class="mb-3">
                    <label for="id_project" class="form-label">Proyecto:</label>
                    {{ form.project }}
                </div>

                <button type="submit" class="btn btn-primary btn-lg">Guardar</button>
               
            </form>
        </div>

        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
    </html>
{% endblock %}
