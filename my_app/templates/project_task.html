<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tareas de {{ project.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">Tareas de "{{ project.name }}"</h1>
    {% if tasks %}
        <ul class="list-group">
            {% for task in tasks %}
                <li class="list-group-item">
                    <strong>{{ task.title }}</strong>: {{ task.description }}
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No hay tareas para este proyecto aún.</p>
    {% endif %}
    <a href="{% url 'home:home' %}" class="btn btn-secondary mt-3">Volver a Home</a>
</div>
</body>
</html>
